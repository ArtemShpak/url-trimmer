<nav class="navbar">
  <div class="brand">
    <h3>Trim.ly</h3>
    <a routerLink="/urls" class="nav-link">Усі посилання</a>
  </div>

  <div *ngIf="authService.currentUser$ | async as user; else guestTemplate" class="user-controls">
    <span>
      {{ user.email }} <span class="role-badge">{{ user.role }}</span>
    </span>
    <button (click)="logout()" class="btn-logout">Вийти</button>
  </div>

  <ng-template #guestTemplate>
    <div class="user-controls">
      <a routerLink="/login" class="nav-link">Увійти</a>
      <a routerLink="/register" class="btn-primary" style="text-decoration: none;">Реєстрація</a>
    </div>
  </ng-template>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
